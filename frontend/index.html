<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İBİS Projesi | Giriş</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #17233c; font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #d7dbe3;
  }
  .kart-alani { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 20px; }
  a.kart {
    text-decoration: none; color: #fff; background: #1b2a48; border: 1px solid #2c3e63; border-radius: 12px;
    padding: 28px 32px; width: 240px; text-align: center; transition: border-color .15s, transform .15s;
  }
  a.kart:hover { border-color: #2f7bf0; transform: translateY(-2px); }
  a.kart .ikon { font-size: 34px; margin-bottom: 12px; }
  a.kart .baslik { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
  a.kart .aciklama { font-size: 11.5px; color: #8b93a3; line-height: 1.5; }
</style>
</head>
<body>
  <div class="kart-alani">
    <a class="kart" href="/ris/">
      <div class="ikon">🩻</div>
      <div class="baslik">RİS Ekranı</div>
      <div class="aciklama">Radyoloji Bilgi Sistemi — insidental bulgu bildirimi burada yapılır.</div>
    </a>
    <a class="kart" href="/ibis/">
      <div class="ikon">🏥</div>
      <div class="baslik">İBİS Paneli</div>
      <div class="aciklama">Takip listesi, klinisyen onayı, eskalasyon ve simülasyon burada yönetilir.</div>
    </a>
  </div>
</body>
</html>
